<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>照明コントローラー · デザインプレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0ed;color:#263a35;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}main{max-width:1100px;margin:64px auto;padding:0 32px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#657a72}h1{font-size:30px;font-weight:600;margin:14px 0}p{font-size:14px;color:#718078;line-height:1.9}.workspace{display:flex;gap:64px;align-items:center;margin:46px 0}.device{background:#303835;padding:22px;border-radius:25px;box-shadow:0 24px 50px #263a3522}.screen-wrap{width:640px;height:480px;overflow:hidden;border-radius:4px}.screen{width:320px;height:240px;transform:scale(2);transform-origin:top left;background:#111e1c;color:#e9f0e9;padding:8px;font-size:12px;position:relative}.screen button{font-family:inherit;cursor:pointer;border:0;color:inherit;font-size:12px}.top{display:flex;align-items:center;gap:4px;height:28px}.tab{background:transparent;border-radius:7px;padding:7px 13px;color:#84988f!important}.tab.active{background:#30483e;color:#e4f0d7!important}.wifi{margin-left:auto;font-size:9px;color:#8caa95}.wifi:before{content:'●';font-size:7px;margin-right:4px;color:#b9d58d}.status{display:flex;justify-content:space-between;align-items:center;margin:9px 2px 7px;height:21px}.power{font-size:16px;font-weight:600}.estimate{font-size:9px;color:#8b9f95;margin-left:6px}.badge{color:#c5dca7;font-size:10px}.power-buttons{display:flex;gap:5px}.power-buttons button{height:30px;flex:1;background:#233630;border-radius:6px;color:#b1c2b8}.power-buttons button.chosen{background:#c8dda7;color:#233222}.label{display:flex;justify-content:space-between;font-size:10px;color:#95aba0;margin:9px 2px 5px}.label strong{font-size:11px;color:#e4eedf;font-weight:500}.segments{display:flex;gap:4px}.segments button{flex:1;padding:0;height:27px;border-radius:5px;background:#233630;font-size:10px;color:#abbfb2}.segments button.chosen{background:#c8dda7;color:#233222}.color button{background:#34392c}.color button:nth-child(n+4){background:#293c3c}.color button.chosen{background:#d8dfc5;color:#233222}.actions{display:flex;gap:5px;margin-top:9px}.actions button{flex:1;background:#30483e;border-radius:6px;height:29px;color:#d7e5cf;font-size:11px}.footer{position:absolute;bottom:7px;left:10px;right:10px;display:flex;justify-content:space-between;color:#81988a;font-size:9px;border-top:1px solid #25302c;padding-top:6px}.footer span:first-child{color:#bad19e}.kitchen-adjust{display:flex;gap:5px;margin-top:12px}.kitchen-adjust button{flex:1;height:35px;border-radius:6px;background:#233630;font-size:12px}.sync{width:100%;height:30px;background:#30483e;border-radius:6px;margin-top:8px;font-size:10px!important}.screen button:focus-visible{outline:2px solid white;outline-offset:1px}.screen button:disabled{opacity:.45;cursor:wait}.panel{min-width:220px;flex:1}.panel h2{font-size:14px;margin-bottom:20px}.control{display:block;font-size:12px;margin:20px 0;color:#62776b}.control select{display:block;width:100%;margin-top:8px;padding:10px;background:#f8faf6;border:1px solid #cdd6cb;border-radius:7px;color:#263a35}.note{border-top:1px solid #d4dbd1;padding-top:20px;font-size:12px}.size{font-size:11px;text-align:center;letter-spacing:.1em;margin-top:15px;color:#75867b}.guide{max-width:720px;font-size:12px}button:hover{filter:brightness(1.09)}@media(max-width:1000px){.workspace{flex-direction:column;align-items:flex-start;gap:25px}.panel{max-width:640px;width:100%}}@media(max-width:720px){main{margin:30px auto;padding:0 16px}.device{padding:14px}.screen-wrap{width:320px;height:240px}.screen{transform:none}h1{font-size:24px}.workspace{margin-top:25px}}
.top{height:26px}.status{height:20px;margin:5px 2px}.power-buttons button{height:28px}.label{height:12px;line-height:12px;margin:6px 2px 4px}.segments button{height:25px}.actions{margin-top:7px}.actions button{height:25px}.footer{height:17px;bottom:4px;padding-top:4px}.workspace{gap:32px}.panel{min-width:190px}@media(max-width:1060px){.workspace{flex-direction:column;align-items:flex-start}.panel{width:100%;max-width:640px}}
.color button{background:var(--swatch)!important;color:#26352c!important;border:2px solid transparent;font-size:13px}.color button.chosen{border-color:#b8d58b;box-shadow:inset 0 0 0 1px #26352c}.color button:hover{filter:brightness(1.04)}
.sync-help{text-align:center;font-size:9px;color:#95aba0;margin-top:5px;line-height:12px}
.calibration{position:absolute;left:10px;bottom:30px;display:flex;align-items:center;justify-content:flex-start;gap:9px}.calibration .sync{width:auto;height:25px;margin:0;padding:0 10px;background:#1b2b26;color:#a7baac;border:0;font-size:10px!important;border-radius:5px}.calibration .sync-help{margin:0;font-size:9px;color:#81988a;line-height:12px}
.screen .secondary-power{position:absolute;right:10px;bottom:30px;height:25px;padding:0 10px;background:#1b2b26;color:#a7baac;border:0;font-size:10px;border-radius:5px}
.kitchen-label{margin-top:12px;margin-bottom:4px}.kitchen-label+.kitchen-adjust{margin-top:6px}
.kitchen-adjust.segments button{height:25px;font-size:10px}.kitchen-adjust.segments button.chosen{background:#c8dda7;color:#233222}
.wifi{display:flex;align-items:center;margin-right:0;color:#b9d58d}.wifi.offline{color:#819087}.wifi:before{content:none}
</style>
<main>
<div class="eyebrow">CORES3 SE / INTERFACE STUDY 01</div>
<h1>灯りを、手元で心地よく。</h1>
<p>照明コントローラーの画面デザイン案。ボタンを押して、表示と操作感を確認できます。</p>
<div class="workspace">
<div><div class="device"><div class="screen-wrap"><div class="screen" id="screen"></div></div></div><div class="size">320 × 240 px · PCでは2倍表示 / 小さな画面では等倍</div></div>
<aside class="panel"><h2>表示を試す</h2>
<label class="control">照明の状態<select id="scenario"><option value="on">点灯・推定値あり</option><option value="unknown">起動直後・未確認</option><option value="normal">普段設定</option><option value="night">常夜灯</option><option value="off">消灯</option><option value="error">通信失敗</option></select></label>
<label class="control">ネットワーク<select id="network"><option value="online">Wi-Fi 接続中</option><option value="offline">Wi-Fi 未接続</option></select></label>
<p class="note">プレビュー専用です。操作は画面内で再現し、照明や本体とは通信しません。</p></aside>
</div>
<p class="guide">落ち着いた深緑と、選択した項目を示す明るいセージ色。点灯操作、明るさ、色を上から順に配置しました。表示値はすべて推定です。本体の日本語フォント・発色・タッチ感は、最終的に実機での確認が必要です。</p>
</main>
<script>
let selected=0;
const initial=()=>({power:'on',brightness:60,color:40,normal:false,busy:false,notice:'操作できます',progress:0});
const states=[initial(),initial()];
const screen=document.querySelector('#screen');
const scenario=document.querySelector('#scenario'),network=document.querySelector('#network');
const names={on:'点灯中',off:'消灯',night:'常夜灯',unknown:'状態未確認'};
const button=(text,action,chosen=false,disabled=false)=>`<button data-action="${action}" class="${chosen?'chosen':''}" ${disabled?'disabled':''}>${text}</button>`;
function render(){const s=states[selected];const val=x=>x===null?(s.normal?'普段設定':'未確認'):x+'%';const disabled=s.busy;
screen.innerHTML=`<div class="top"><button class="tab ${selected===0?'active':''}" data-tab="0">キッチン</button><button class="tab ${selected===1?'active':''}" data-tab="1">リビング</button><span class="wifi ${network.value==='online'?'online':'offline'}" role="img" aria-label="Wi-Fi ${network.value==='online'?'接続中':'未接続'}" title="Wi-Fi ${network.value==='online'?'接続中':'未接続'}"><svg width="28" height="26" viewBox="0 0 28 26" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 10 A13 13 0 0 1 23 10 M9 14 A8 8 0 0 1 19 14"/>${network.value==='online'?'':'<path d="M4 5 L24 22" stroke="#111e1c" stroke-width="4"/><path d="M4 5 L24 22"/>'}</g><circle cx="14" cy="20" r="2" fill="currentColor"/></svg></span></div><div class="status"><div><span class="power">${names[s.power]}</span></div><span class="badge">${s.busy?'送信中…':s.normal?'普段設定':''}</span></div><div class="power-buttons">${button('点灯','on',s.power==='on',disabled)}${button('常夜灯','night',s.power==='night',disabled)}${button('消灯','off',s.power==='off',disabled)}</div>`;
if(selected===1){screen.innerHTML+=`<div class="label"><span>明るさ</span><strong>${val(s.brightness)}</strong></div><div class="segments">${[0,20,40,60,80,100].map(v=>button(v+'%','brightness:'+v,s.brightness===v,disabled)).join('')}</div><div class="label"><span>色</span><strong>${s.color===null?val(s.color):''}</strong></div><div class="segments color">${['#ffbd6b','#ffd08c','#ffdfb0','#ffeacb','#fff2e3','#f4f8ff'].map((c,i)=>`<button data-action="color:${i*20}" class="${s.color===i*20?'chosen':''}" style="--swatch:${c}" aria-label="色 ${['最も暖かい','暖かい','やや暖かい','やや白い','白い','最も白い'][i]}" aria-pressed="${s.color===i*20}" ${disabled?'disabled':''}>${s.color===i*20?'✓':''}</button>`).join('')}</div><div class="actions">${button('全灯','full',false,disabled)}${button('普段','normal',false,disabled)}</div>`}
else{screen.innerHTML+=`<div class="label kitchen-label"><span>明るさ</span><strong>${val(s.brightness)}</strong></div><div class="kitchen-adjust segments">${[20,40,60,80,100].map(v=>button(v+'%','brightness:'+v,s.brightness===v,disabled||s.power!=='on')).join('')}</div><div class="calibration"><button class="sync" data-action="sync" ${disabled?'disabled':''}>キャリブレーション</button><span class="sync-help">点灯中に押す</span></div><button class="secondary-power" data-action="cycle" ${disabled?'disabled':''}>電源ボタン</button>`}
screen.innerHTML+=`<div class="footer" role="status" aria-live="polite"><span>${s.busy?'送信中 '+s.progress+' / '+s.total:s.notice}</span><span>DEMO</span></div>`;
}
screen.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){selected=Number(b.dataset.tab);render();return}act(b.dataset.action)});
function act(action){let s=states[selected];const id=selected;if(s.busy)return;if(network.value==='offline'){s.notice='Wi-Fi未接続です';render();return}
if(id===0&&action.startsWith('brightness:')&&s.brightness===null){s.notice='先に点灯中に合わせてください';render();return}
let total=1;let [axis,target]=action.split(':');if(axis==='brightness'||axis==='color'){target=Number(target);if(s.power==='on'&&s[axis]===target)return;const known=s.power==='on'?s[axis]:null;total=(s.power==='on'?0:1)+(known===null?5+Math.min(target,100-target)/20:Math.abs(known-target)/20)}if(action==='sync')total=4;
s.busy=true;s.progress=0;s.total=total;render();let timer=setInterval(()=>{s.progress++;if(s.progress>=total){clearInterval(timer);s.busy=false;s.notice='送信完了（受信は未確認）';if(['on','night','off'].includes(action)){s.power=action;if(id===1&&action==='on'){s.normal=true;s.brightness=s.color=null}}if(action==='cycle')s.power=({on:'night',night:'off',off:'on',unknown:'unknown'})[s.power];if(action==='sync'){s.power='on';s.brightness=100}if(action==='up')s.brightness=Math.min(100,s.brightness+20);if(action==='down')s.brightness=Math.max(20,s.brightness-20);if(action==='normal'||action==='full'){s.power='on';s.normal=action==='normal';s.brightness=action==='full'?100:null;s.color=null}if(axis==='brightness'||axis==='color'){if(s.power!=='on'){s.brightness=s.color=null;s.normal=false}s.power='on';s[axis]=target}}
if(selected===id)render()},450)}
scenario.addEventListener('change',()=>{let s=states[selected];if(s.busy){scenario.value=s.power;return}Object.assign(s,initial());const v=scenario.value;if(['off','night','unknown'].includes(v))s.power=v;if(v==='unknown'){s.brightness=s.color=null;s.notice='実際に点灯し、画面で合わせてください'}if(v==='normal'){s.normal=true;s.brightness=s.color=null}if(v==='error'){s.brightness=null;s.notice='通信失敗 · 明るさ未確認'}render()});network.addEventListener('change',render);render();
</script>
</html>
