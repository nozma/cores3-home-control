<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自動制御の設定画面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0ed;color:#263a35;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}main{max-width:850px;margin:48px auto;padding:24px}h1{font-size:25px}p{font-size:14px;line-height:1.9;color:#65776e}.device{background:#303835;padding:22px;border-radius:25px;width:max-content;margin:28px 0;box-shadow:0 24px 50px #263a3522}.viewport{width:640px;height:480px}.screen{position:relative;width:320px;height:240px;transform:scale(2);transform-origin:top left;background:#111e1c;color:#e9f0e9;font-size:12px}.screen button,.screen span{position:absolute;display:flex;align-items:center;justify-content:center;font:inherit;white-space:nowrap}.screen button{border:0;border-radius:5px;background:#233630;color:#e9f0e9;cursor:pointer}.screen button:disabled{cursor:default}.screen button:focus-visible{outline:1px solid white}.screen .tab{top:8px;width:72px;height:26px;background:transparent;color:#95aba0}.screen .active{background:#30483e;color:#e9f0e9}.screen .enabled{background:#c8dda7;color:#111e1c}.screen .muted{color:#95aba0}small{color:#65776e}@media(max-width:730px){.viewport{width:320px;height:240px}.screen{transform:none}main{padding:12px}.device{padding:12px}}
</style><main><h1>自動制御の設定画面</h1><p>有効・無効と時刻のボタンを押して確認できます。初期設定を表示しています。</p><div class="device"><div class="viewport"><div class="screen" id="screen"></div></div></div><small>320 × 240 px（広い画面では2倍表示）</small><p>プレビュー内の操作です。実際の照明や本体の設定は変更しません。配置・配色・ボタンの大きさは実装に合わせていますが、日本語フォントや文字幅は実機と異なります。</p><p><a href="index.html">キッチン・リビングのプレビューへ</a></p></main>
<script>
let enabled=false;const values=[390,1020,1380],limits=[[300,540],[900,1140],[1260,1440]],labels=['起床','終業','就寝'];let notice='自動制御は無効です';
const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function render(){const screen=document.querySelector('#screen');screen.innerHTML=`<button class="tab" style="left:8px" data-nav="index.html">キッチン</button><button class="tab" style="left:84px" data-nav="index.html">リビング</button><button class="tab active" style="left:160px">自動制御</button><span style="left:284px;top:9px;width:28px;height:26px;color:#b9d58d"><svg width="28" height="26" viewBox="0 0 28 26"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M5 10 A13 13 0 0 1 23 10 M9 14 A8 8 0 0 1 19 14"/></g><circle cx="14" cy="20" r="2" fill="currentColor"/></svg></span><button id="toggle" class="${enabled?'enabled':''}" style="left:8px;top:43px;width:304px;height:29px">自動制御：${enabled?'有効':'無効'}</button>`;
values.forEach((m,i)=>{let y=81+i*35;screen.innerHTML+=`<span style="left:10px;top:${y}px;width:46px;height:26px">${labels[i]}</span><button data-field="${i}" data-dir="-1" style="left:68px;top:${y}px;width:45px;height:27px">−</button><span style="left:119px;top:${y}px;width:100px;height:26px">${fmt(m)}</span><button data-field="${i}" data-dir="1" style="left:250px;top:${y}px;width:60px;height:27px">＋</button>`});
screen.innerHTML+=`<span style="left:10px;top:219px;width:300px;height:17px;border-top:1px solid #25302c;padding-top:4px;justify-content:flex-start;color:#c8dda7;font-size:9px;overflow:hidden">${notice}</span>`;}
document.querySelector('#screen').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){location.href=b.dataset.nav;return}if(b.id==='toggle'){enabled=!enabled;notice=enabled?'有効化：現在の時間帯の状態へ合わせます':'自動制御は無効です'}else if(b.dataset.field!==undefined){let i=+b.dataset.field;values[i]=Math.max(limits[i][0],Math.min(limits[i][1],values[i]+15*+b.dataset.dir));notice=enabled?'次の予定を待っています':'自動制御は無効です'}render()});render();
</script></html>
